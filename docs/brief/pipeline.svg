<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" font-family="Segoe UI, Arial, sans-serif">
  <title>Anaam pipeline: one run of python main.py, in order</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#204B42"/>
    </marker>
    <style>
      .box { fill: #F6F8F6; stroke: #204B42; stroke-width: 1.6; }
      .out { fill: #204B42; stroke: #204B42; }
      .n { fill: #204B42; }
      .nt { fill: #fff; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .t { fill: #16201d; font-size: 19.5px; font-weight: 700; }
      .d { fill: #2c3833; font-size: 19px; }
      .q { fill: #A94F45; font-size: 19px; font-weight: 600; }
      .m { font-family: Consolas, monospace; font-size: 17.5px; fill: #fff; }
      .w { fill: #fff; }
      .ln { stroke: #204B42; stroke-width: 2; fill: none; }
      .lg { fill: #2c3833; font-size: 19px; }
    </style>
  </defs>

  <!-- row 1 -->
  <g transform="translate(0,8)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">1</text>
    <text class="t" x="40" y="31">Preflight</text>
    <text class="d" x="12" y="60">secret must be set</text>
    <text class="d" x="12" y="83">empty output dir</text>
    <text class="d" x="12" y="106">network blocked</text>
  </g>
  <g transform="translate(204,8)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">2</text>
    <text class="t" x="40" y="31">Inventory</text>
    <text class="d" x="12" y="60">sorted file walk</text>
    <text class="d" x="12" y="83">SHA-256 per file</text>
    <text class="d" x="12" y="106">duplicates kept</text>
  </g>
  <g transform="translate(408,8)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">3</text>
    <text class="t" x="40" y="31">Ingest</text>
    <text class="d" x="12" y="60">decode + sniff</text>
    <text class="d" x="12" y="83">CSV TSV JSON FHIR</text>
    <text class="q" x="12" y="106">bad → quarantine</text>
  </g>
  <g transform="translate(612,8)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">4</text>
    <text class="t" x="40" y="31">Learn dataset</text>
    <text class="d" x="12" y="60">classify columns</text>
    <text class="d" x="12" y="83">and keys by value</text>
    <text class="d" x="12" y="106">build ID lexicon</text>
  </g>
  <g transform="translate(816,8)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">5</text>
    <text class="t" x="40" y="31">Detect spans</text>
    <text class="d" x="12" y="60">clinical shield</text>
    <text class="d" x="12" y="83">PII in 3 scripts</text>
    <text class="d" x="12" y="106">hidden channels</text>
  </g>
  <path class="ln" d="M182,67 H202" marker-end="url(#a)"/>
  <path class="ln" d="M386,67 H406" marker-end="url(#a)"/>
  <path class="ln" d="M590,67 H610" marker-end="url(#a)"/>
  <path class="ln" d="M794,67 H814" marker-end="url(#a)"/>
  <!-- return to row 2 -->
  <path class="ln" d="M907,126 V150 H91 V170" marker-end="url(#a)"/>

  <!-- row 2 -->
  <g transform="translate(0,172)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">6</text>
    <text class="t" x="40" y="31">Link patients</text>
    <text class="d" x="12" y="60">block, score, link</text>
    <text class="d" x="12" y="83">abstain if unsure</text>
    <text class="d" x="12" y="106">HMAC pseudonym</text>
  </g>
  <g transform="translate(204,172)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">7</text>
    <text class="t" x="40" y="31">Privacy layer</text>
    <text class="d" x="12" y="60">per-patient shift</text>
    <text class="d" x="12" y="83">5-year age bands</text>
    <text class="d" x="12" y="106">rare place lifted</text>
  </g>
  <g transform="translate(408,172)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">8</text>
    <text class="t" x="40" y="31">Render</text>
    <text class="d" x="12" y="60">same path, format</text>
    <text class="d" x="12" y="83">keyed file names</text>
    <text class="d" x="12" y="106">held in memory</text>
  </g>
  <g transform="translate(612,172)">
    <rect class="box" width="182" height="118" rx="8"/>
    <circle class="n" cx="20" cy="24" r="13"/><text class="nt" x="20" y="30">9</text>
    <text class="t" x="40" y="31">Release gate</text>
    <text class="d" x="12" y="60">re-scan every file</text>
    <text class="d" x="12" y="83">rescrub once, else</text>
    <text class="q" x="12" y="106">quarantine the file</text>
  </g>
  <g transform="translate(816,172)">
    <rect class="box out" width="182" height="118" rx="8"/>
    <circle cx="20" cy="24" r="13" fill="#fff"/><text class="nt" x="20" y="30" fill="#204B42" style="fill:#204B42">10</text>
    <text class="t w" x="40" y="31" style="fill:#fff">Publish</text>
    <text class="m" x="12" y="60">sanitized/</text>
    <text class="m" x="12" y="83">report.json</text>
    <text class="m" x="12" y="106">records.jsonl</text>
  </g>
  <path class="ln" d="M182,231 H202" marker-end="url(#a)"/>
  <path class="ln" d="M386,231 H406" marker-end="url(#a)"/>
  <path class="ln" d="M590,231 H610" marker-end="url(#a)"/>
  <path class="ln" d="M794,231 H814" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="2" y="306" width="14" height="14" fill="#A94F45"/>
  <text class="lg" x="24" y="319">Quarantined files are never copied; report.json lists each by SHA-256 with a reason code.</text>
  <rect x="2" y="332" width="14" height="14" fill="#204B42"/>
  <text class="lg" x="24" y="345">Steps 1–9 hold all data in memory; only step 10 writes, by one atomic directory rename.</text>
</svg>
